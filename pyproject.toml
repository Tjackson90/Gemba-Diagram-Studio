[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gemba-guitar-diagram-studio"
version = "0.4.0"
description = "Guitar lesson diagrams, audio, tablature and video exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3", "customtkinter>=5.2,<6", "PySide6>=6.10,<7",
                "sounddevice>=0.4,<1", "soundfile>=0.12,<1", "scipy>=1.15,<2"]

[project.optional-dependencies]
audio = ["scipy>=1.11,<2", "pedalboard>=0.9,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
gemba-studio = "studio:main"

[tool.setuptools]
py-modules = ["studio", "config"]

[tool.setuptools.packages.find]
include = ["audio*", "cli*", "data*", "diagrams*", "gui*", "services*", "fonts*"]

[tool.setuptools.package-data]
fonts = ["*.ttf", "*-OFL.txt"]
audio = ["samples/*/*.flac", "samples/*.json", "samples/*.md", "samples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
